name: Deploy Dashboard to GitHub Pages

# Builds the Next.js dashboard as a static site and publishes it to GitHub
# Pages. Runs on GitHub's runners, which have full network access, so this is
# also the place where `npm install` / `next build` actually get exercised.

on:
  push:
    branches:
      - feature/mplads-ai-dashboard
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least-privilege token, plus the two permissions Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. cancel-in-progress MUST stay false:
# a production deployment already underway should be allowed to finish, and
# with `true` two runs triggered close together (e.g. re-running two runs from
# the Actions UI) cancel each other and neither publishes. This matches
# GitHub's official Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # NOTE: npm caching is deliberately NOT enabled here. `cache: npm`
      # requires a committed package-lock.json to hash, and this repo has none
      # yet — setup-node hard-fails with "Some specified paths were not
      # resolved" rather than degrading gracefully. Once a lockfile is
      # committed, add `cache: npm` + `cache-dependency-path:
      # frontend/package-lock.json` and switch `npm install` to `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build static site
        env:
          # Serve under /<repo>/ on github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Stops GitHub Pages from running the output through Jekyll, which would
      # strip Next.js's _next/ directory.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # NOTE: actions/configure-pages is deliberately NOT used here.
      #
      # Its only purpose is to emit base_path/base_url outputs, which we don't
      # need (BASE_PATH is set explicitly above). Worse, when the repo's Pages
      # site doesn't exist yet it tries to create one and hard-fails with
      # "Create Pages site failed: Resource not accessible by integration" —
      # GITHUB_TOKEN can *deploy to* an existing Pages site but cannot create
      # one, regardless of `pages: write`. Omitting it keeps this build job
      # green and still uploads the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4


# ---------------------------------------------------------------------------
# ONE-TIME SETUP REQUIRED (repo admin only)
#
# Before the deploy job can succeed, GitHub Pages must be switched on for this
# repository with Actions as its source:
#
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# This cannot be automated from inside the workflow: creating a Pages site
# needs repo-admin rights, and the Actions GITHUB_TOKEN is not permitted to do
# it ("Resource not accessible by integration"). Once the switch is flipped,
# re-run this workflow (Actions → Deploy Dashboard to GitHub Pages → Re-run
# jobs) and the site publishes to:
#
#   https://<owner>.github.io/<repo>/
# ---------------------------------------------------------------------------
