name: Deploy Dashboard to GitHub Pages

# Builds the Next.js dashboard as a static site and publishes it to GitHub
# Pages. Runs on GitHub's runners, which have full network access, so this is
# also the place where `npm install` / `next build` actually get exercised.

on:
  push:
    branches:
      - feature/mplads-ai-dashboard
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least-privilege token, plus the two permissions Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel superseded in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # NOTE: npm caching is deliberately NOT enabled here. `cache: npm`
      # requires a committed package-lock.json to hash, and this repo has none
      # yet — setup-node hard-fails with "Some specified paths were not
      # resolved" rather than degrading gracefully. Once a lockfile is
      # committed, add `cache: npm` + `cache-dependency-path:
      # frontend/package-lock.json` and switch `npm install` to `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build static site
        env:
          # Serve under /<repo>/ on github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Stops GitHub Pages from running the output through Jekyll, which would
      # strip Next.js's _next/ directory.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # `enablement: true` turns GitHub Pages on for the repo if it isn't
      # already, using this workflow's `pages: write` permission.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
