name: Backend tests
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mplads
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: mplads_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mplads -d mplads_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test both database engines
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://mplads:test-only@localhost:5432/mplads_test' || 'sqlite://' }}
        run: pytest -q
      - name: Test migrations and seeded startup
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://mplads:test-only@localhost:5432/mplads_test' || 'sqlite:///./migration-test.db' }}
          DEMO_MODE: "true"
          AUTO_CREATE_TABLES: "false"
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed
          python -m app.tasks.scoring_job
