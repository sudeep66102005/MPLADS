services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mplads_ai
      POSTGRES_USER: mplads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplads -d mplads_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://mplads:${POSTGRES_PASSWORD}@db:5432/mplads_ai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
      ENVIRONMENT: production
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      AUTO_CREATE_TABLES: "false"
      UPLOAD_DIR: /app/data/uploads
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  uploads:
