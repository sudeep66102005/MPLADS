version: "3.9"

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: mplads-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mplads_ai
      POSTGRES_USER: mplads
      POSTGRES_PASSWORD: mplads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplads -d mplads_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional — comment out if not needed) ────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mplads-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mplads.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
