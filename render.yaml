# Free demonstration deployment. Render free PostgreSQL expires after 30 days.
# GitHub Pages continues to host the frontend; this hosts only API + database.
services:
  - type: web
    name: mplads-api
    runtime: docker
    branch: feature/mplads-ai-dashboard
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mplads-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: https://sudeep66102005.github.io
      - key: EVIDENCE_STORAGE
        value: database
      - key: DEMO_MODE
        value: "true"
databases:
  - name: mplads-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: mplads_ai
    user: mplads
